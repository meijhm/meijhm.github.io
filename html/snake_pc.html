<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫彩贪吃蛇</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 600px;
            height: 600px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            overflow: hidden;
        }
        
        #game-canvas {
            background-color: #0f0f1a;
            display: block;
        }
        
        .score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            text-shadow: 0 0 5px #00ffff;
            z-index: 10;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        
        .game-over h1 {
            color: #ff5555;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .final-score {
            color: #fff;
            font-size: 32px;
            margin-bottom: 30px;
        }
        
        .restart-btn {
            padding: 12px 30px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
        
        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
        }
        
        .restart-btn:active {
            transform: translateY(1px);
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-display">分数: <span id="score">0</span></div>
        <canvas id="game-canvas" width="600" height="600"></canvas>
        <div class="game-over">
            <h1>游戏结束!</h1>
            <div class="final-score">最终分数: <span id="final-score">0</span></div>
            <button class="restart-btn" id="restart-btn">重新开始</button>
        </div>
        <div class="controls">使用方向键或WASD控制蛇的移动</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('final-score');
            const gameOverScreen = document.querySelector('.game-over');
            const restartBtn = document.getElementById('restart-btn');
            
            // 游戏常量
            const GRID_SIZE = 20;
            const TILE_COUNT = canvas.width / GRID_SIZE;
            const FPS = 10;
            
            // 游戏变量
            let snake = [];
            let food = {};
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let gameInterval;
            let isGameOver = false;
            let growing = 0;
            
            // 颜色设置
            const colors = {
                snakeHead: '#00ffaa',
                snakeBody: '#00cc88',
                food: '#ff5555',
                specialFood: '#ffcc00'
            };
            
            // 初始化游戏
            function initGame() {
                // 初始化蛇
                snake = [
                    {x: 10, y: 10},
                    {x: 9, y: 10},
                    {x: 8, y: 10}
                ];
                
                // 初始方向
                direction = 'right';
                nextDirection = 'right';
                
                // 初始分数
                score = 0;
                scoreDisplay.textContent = score;
                
                // 生成食物
                generateFood();
                
                // 重置游戏状态
                isGameOver = false;
                growing = 0;
                
                // 隐藏游戏结束界面
                gameOverScreen.style.display = 'none';
                
                // 开始游戏循环
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, 1000 / FPS);
            }
            
            // 游戏主循环
            function gameLoop() {
                if (isGameOver) return;
                
                // 更新方向
                direction = nextDirection;
                
                // 移动蛇
                moveSnake();
                
                // 检查碰撞
                checkCollisions();
                
                // 检查是否吃到食物
                checkFood();
                
                // 绘制游戏
                drawGame();
            }
            
            // 移动蛇
            function moveSnake() {
                // 获取蛇头
                const head = {x: snake[0].x, y: snake[0].y};
                
                // 根据方向移动蛇头
                switch (direction) {
                    case 'up':
                        head.y -= 1;
                        break;
                    case 'down':
                        head.y += 1;
                        break;
                    case 'left':
                        head.x -= 1;
                        break;
                    case 'right':
                        head.x += 1;
                        break;
                }
                
                // 添加新蛇头
                snake.unshift(head);
                
                // 如果不在生长阶段，移除蛇尾
                if (growing > 0) {
                    growing--;
                } else {
                    snake.pop();
                }
            }
            
            // 检查碰撞
            function checkCollisions() {
                const head = snake[0];
                
                // 检查墙壁碰撞
                if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                    gameOver();
                    return;
                }
                
                // 检查自身碰撞
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver();
                        return;
                    }
                }
            }
            
            // 检查食物
            function checkFood() {
                const head = snake[0];
                
                // 检查是否吃到食物
                if (head.x === food.x && head.y === food.y) {
                    // 增加分数
                    score += food.special ? 5 : 1;
                    scoreDisplay.textContent = score;
                    
                    // 增加蛇长度
                    growing += food.special ? 3 : 1;
                    
                    // 生成食物粒子效果
                    createParticles(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, food.special ? colors.specialFood : colors.food);
                    
                    // 生成新食物
                    generateFood();
                }
            }
            
            // 生成食物
            function generateFood() {
                let validPosition = false;
                let foodX, foodY;
                
                // 随机生成食物位置，确保不在蛇身上
                while (!validPosition) {
                    foodX = Math.floor(Math.random() * TILE_COUNT);
                    foodY = Math.floor(Math.random() * TILE_COUNT);
                    
                    validPosition = true;
                    for (let segment of snake) {
                        if (segment.x === foodX && segment.y === foodY) {
                            validPosition = false;
                            break;
                        }
                    }
                }
                
                // 10%概率生成特殊食物
                const isSpecial = Math.random() < 0.1;
                
                food = {
                    x: foodX,
                    y: foodY,
                    special: isSpecial
                };
            }
            
            // 绘制游戏
            function drawGame() {
                // 清空画布
                ctx.fillStyle = '#0f0f1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格线
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < TILE_COUNT; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * GRID_SIZE, 0);
                    ctx.lineTo(i * GRID_SIZE, canvas.height);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(0, i * GRID_SIZE);
                    ctx.lineTo(canvas.width, i * GRID_SIZE);
                    ctx.stroke();
                }
                
                // 绘制蛇
                for (let i = 0; i < snake.length; i++) {
                    const segment = snake[i];
                    
                    // 蛇头使用不同颜色
                    if (i === 0) {
                        // 蛇头渐变效果
                        const gradient = ctx.createRadialGradient(
                            segment.x * GRID_SIZE + GRID_SIZE/2,
                            segment.y * GRID_SIZE + GRID_SIZE/2,
                            0,
                            segment.x * GRID_SIZE + GRID_SIZE/2,
                            segment.y * GRID_SIZE + GRID_SIZE/2,
                            GRID_SIZE/2
                        );
                        gradient.addColorStop(0, colors.snakeHead);
                        gradient.addColorStop(1, colors.snakeBody);
                        ctx.fillStyle = gradient;
                    } else {
                        // 蛇身使用渐变颜色
                        const alpha = 0.7 - (i / snake.length) * 0.5;
                        ctx.fillStyle = `rgba(0, 204, 136, ${alpha})`;
                    }
                    
                    // 绘制蛇身段
                    ctx.beginPath();
                    ctx.roundRect(
                        segment.x * GRID_SIZE + 2, 
                        segment.y * GRID_SIZE + 2, 
                        GRID_SIZE - 4, 
                        GRID_SIZE - 4, 
                        5
                    );
                    ctx.fill();
                    
                    // 为蛇头添加眼睛
                    if (i === 0) {
                        ctx.fillStyle = 'white';
                        
                        // 根据方向确定眼睛位置
                        let leftEyeX, leftEyeY, rightEyeX, rightEyeY;
                        
                        switch (direction) {
                            case 'up':
                                leftEyeX = segment.x * GRID_SIZE + GRID_SIZE/3;
                                leftEyeY = segment.y * GRID_SIZE + GRID_SIZE/3;
                                rightEyeX = segment.x * GRID_SIZE + GRID_SIZE*2/3;
                                rightEyeY = segment.y * GRID_SIZE + GRID_SIZE/3;
                                break;
                            case 'down':
                                leftEyeX = segment.x * GRID_SIZE + GRID_SIZE/3;
                                leftEyeY = segment.y * GRID_SIZE + GRID_SIZE*2/3;
                                rightEyeX = segment.x * GRID_SIZE + GRID_SIZE*2/3;
                                rightEyeY = segment.y * GRID_SIZE + GRID_SIZE*2/3;
                                break;
                            case 'left':
                                leftEyeX = segment.x * GRID_SIZE + GRID_SIZE/3;
                                leftEyeY = segment.y * GRID_SIZE + GRID_SIZE/3;
                                rightEyeX = segment.x * GRID_SIZE + GRID_SIZE/3;
                                rightEyeY = segment.y * GRID_SIZE + GRID_SIZE*2/3;
                                break;
                            case 'right':
                                leftEyeX = segment.x * GRID_SIZE + GRID_SIZE*2/3;
                                leftEyeY = segment.y * GRID_SIZE + GRID_SIZE/3;
                                rightEyeX = segment.x * GRID_SIZE + GRID_SIZE*2/3;
                                rightEyeY = segment.y * GRID_SIZE + GRID_SIZE*2/3;
                                break;
                        }
                        
                        // 绘制眼睛
                        ctx.beginPath();
                        ctx.arc(leftEyeX, leftEyeY, 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(rightEyeX, rightEyeY, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                // 绘制食物
                if (food.special) {
                    // 特殊食物 - 闪烁效果
                    const pulse = Math.sin(Date.now() / 200) * 0.2 + 0.8;
                    ctx.fillStyle = `rgba(255, 204, 0, ${pulse})`;
                    
                    // 绘制星形
                    drawStar(
                        food.x * GRID_SIZE + GRID_SIZE/2,
                        food.y * GRID_SIZE + GRID_SIZE/2,
                        5,
                        GRID_SIZE/3,
                        GRID_SIZE/6
                    );
                } else {
                    // 普通食物 - 圆形
                    const gradient = ctx.createRadialGradient(
                        food.x * GRID_SIZE + GRID_SIZE/2,
                        food.y * GRID_SIZE + GRID_SIZE/2,
                        0,
                        food.x * GRID_SIZE + GRID_SIZE/2,
                        food.y * GRID_SIZE + GRID_SIZE/2,
                        GRID_SIZE/2
                    );
                    gradient.addColorStop(0, colors.food);
                    gradient.addColorStop(1, '#cc0000');
                    ctx.fillStyle = gradient;
                    
                    ctx.beginPath();
                    ctx.arc(
                        food.x * GRID_SIZE + GRID_SIZE/2,
                        food.y * GRID_SIZE + GRID_SIZE/2,
                        GRID_SIZE/2 - 2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            }
            
            // 绘制星形
            function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let x = cx;
                let y = cy;
                let step = Math.PI / spikes;
                
                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                    
                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }
            
            // 游戏结束
            function gameOver() {
                isGameOver = true;
                clearInterval(gameInterval);
                
                // 显示最终分数
                finalScoreDisplay.textContent = score;
                
                // 显示游戏结束界面
                gameOverScreen.style.display = 'flex';
                
                // 添加爆炸粒子效果
                for (let segment of snake) {
                    createParticles(
                        segment.x * GRID_SIZE + GRID_SIZE/2,
                        segment.y * GRID_SIZE + GRID_SIZE/2,
                        segment === snake[0] ? colors.snakeHead : colors.snakeBody
                    );
                }
            }
            
            // 创建粒子效果
            function createParticles(x, y, color) {
                const particleCount = 15;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    
                    // 随机大小
                    const size = Math.random() * 6 + 2;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    
                    // 设置颜色
                    particle.style.backgroundColor = color;
                    
                    // 初始位置
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    
                    // 添加到游戏容器
                    document.querySelector('.game-container').appendChild(particle);
                    
                    // 随机角度和速度
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    
                    // 动画
                    let posX = x;
                    let posY = y;
                    let opacity = 1;
                    
                    const animate = () => {
                        posX += vx;
                        posY += vy;
                        opacity -= 0.02;
                        
                        particle.style.left = `${posX}px`;
                        particle.style.top = `${posY}px`;
                        particle.style.opacity = opacity;
                        
                        if (opacity > 0) {
                            requestAnimationFrame(animate);
                        } else {
                            particle.remove();
                        }
                    };
                    
                    requestAnimationFrame(animate);
                }
            }
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                // 防止连续按键导致方向直接反转
                switch (e.key.toLowerCase()) {
                    case 'arrowup':
                    case 'w':
                        if (direction !== 'down') nextDirection = 'up';
                        break;
                    case 'arrowdown':
                    case 's':
                        if (direction !== 'up') nextDirection = 'down';
                        break;
                    case 'arrowleft':
                    case 'a':
                        if (direction !== 'right') nextDirection = 'left';
                        break;
                    case 'arrowright':
                    case 'd':
                        if (direction !== 'left') nextDirection = 'right';
                        break;
                }
            });
            
            // 重新开始按钮
            restartBtn.addEventListener('click', initGame);
            
            // 触摸控制（移动设备）
            let touchStartX = 0;
            let touchStartY = 0;
            
            canvas.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault();
            }, {passive: false});
            
            canvas.addEventListener('touchmove', (e) => {
                if (!touchStartX || !touchStartY) return;
                
                const touchEndX = e.touches[0].clientX;
                const touchEndY = e.touches[0].clientY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                // 确定滑动方向
                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平滑动
                    if (dx > 0 && direction !== 'left') nextDirection = 'right';
                    else if (dx < 0 && direction !== 'right') nextDirection = 'left';
                } else {
                    // 垂直滑动
                    if (dy > 0 && direction !== 'up') nextDirection = 'down';
                    else if (dy < 0 && direction !== 'down') nextDirection = 'up';
                }
                
                e.preventDefault();
            }, {passive: false});
            
            // 开始游戏
            initGame();
        });
    </script>
</body>
</html>
